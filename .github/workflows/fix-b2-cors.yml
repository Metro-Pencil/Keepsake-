name: Apply Repo cors.json to Backblaze

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'Backblaze Bucket Name'
        required: true
      key_id:
        description: 'B2 Master Key ID'
        required: true
      app_key:
        description: 'B2 Master Application Key'
        required: true

jobs:
  set-cors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply repo cors.json via B2 CLI
        env:
          B2_APPLICATION_KEY_ID: ${{ github.event.inputs.key_id }}
          B2_APPLICATION_KEY: ${{ github.event.inputs.app_key }}
          BUCKET: ${{ github.event.inputs.bucket_name }}
        run: |
          pip install --quiet b2
          # Write a guaranteed valid Backblaze B2 CORS configuration directly
          cat << 'EOF' > valid_cors.json
          [
            {
              "corsRuleName": "metro-pencil-rule",
              "allowedOrigins": [
                "https://metro-pencil.github.io"
              ],
              "allowedOperations": [
                "s3_head",
                "s3_get",
                "s3_put",
                "s3_post",
                "s3_delete",
                "b2_download_file_by_id",
                "b2_download_file_by_name",
                "b2_upload_file",
                "b2_upload_part"
              ],
              "allowedHeaders": [
                "*"
              ],
              "exposeHeaders": [
                "ETag",
                "x-bz-file-id",
                "x-bz-file-name",
                "x-bz-content-sha1",
                "Date"
              ],
              "maxAgeSeconds": 3600
            }
          ]
          EOF
          cat valid_cors.json
          b2 bucket update --cors-rules "$(cat valid_cors.json)" "$BUCKET" allPrivate
          
