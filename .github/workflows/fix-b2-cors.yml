name: Apply Repo cors.json to Backblaze

on:
  workflow_dispatch:
    inputs:
      bucket_name:
        description: 'Backblaze Bucket Name'
        required: true
      key_id:
        description: 'B2 Master Key ID'
        required: true
      app_key:
        description: 'B2 Master Application Key'
        required: true

jobs:
  set-cors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply repo cors.json via B2 CLI
        env:
          B2_APPLICATION_KEY_ID: ${{ github.event.inputs.key_id }}
          B2_APPLICATION_KEY: ${{ github.event.inputs.app_key }}
          BUCKET: ${{ github.event.inputs.bucket_name }}
        run: |
          pip install --quiet b2
          # Ensure https://metro-pencil.github.io is in cors.json
          python3 -c '
          import json
          with open("cors.json", "r") as f:
              data = json.load(f)
          rules = data if isinstance(data, list) else data.get("corsRules", [data])
          for r in rules:
              origins = r.get("allowedOrigins", [])
              if "https://metro-pencil.github.io" not in origins and "*" not in origins:
                  r["allowedOrigins"] = ["https://metro-pencil.github.io"]
          with open("FinalCors.json", "w") as f:
              json.dump(rules, f)
          '
          cat FinalCors.json
          b2 bucket update --cors-rules "$(cat FinalCors.json)" "$BUCKET" allPrivate
          
