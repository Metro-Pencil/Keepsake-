name = "keepsake-worker"
main = "worker.js"
compatibility_date = "2026-09-01"

# Created with: wrangler kv namespace create NOTES_KV
# Paste the id it prints below.
kv_namespaces = [
  { binding = "NOTES_KV", id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID" }
]

# Set with: wrangler secret put API_TOKEN
# (not defined here — secrets never go in this file)

# No R2 bucket needed — note content, metadata, and the password-2 vault
# all live in the one KV namespace above. This avoids the payment-method
# requirement Cloudflare has for enabling R2 on an account.

# Optional: keep photos and audio in a Backblaze B2 bucket instead of inside
# the notes (see "Backblaze B2" in the README). Fill these two in, then add the
# secrets with:   wrangler secret put B2_KEY_ID    and    wrangler secret put B2_APP_KEY
# Leave both empty and the app works exactly as before.
[vars]
B2_ENDPOINT = ""   # e.g. "s3.us-west-004.backblazeb2.com" (shown on your bucket's page)
B2_BUCKET = ""     # e.g. "ougi-media-2026"
